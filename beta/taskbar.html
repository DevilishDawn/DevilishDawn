<html>
  <body>
    <style>
      .taskbar-root {
        width: 100%; height: 30px; border-top: 1px solid rgb(53, 110, 226);background: linear-gradient(to bottom,rgb(36, 93, 215) 0%,rgb(53, 110, 226) 3%,rgb(56, 115, 231) 6%,rgb(51, 107, 222) 10%,rgb(37, 85, 203) 30%,rgb(26, 68, 185) 50%,rgb(19, 56, 171) 70%,rgb(13, 44, 156) 85%,rgb(10, 36, 144) 100%);box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15); border: none;

        align-items: center;

      <div class="start-button-container">
