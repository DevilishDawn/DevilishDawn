<!DOCTYPE html>
<html lang="en">
<html>
  <head>
    <title>AODash</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <script src="script.js" defer></script>
    <div class="Main">
      <div class="Widgets">
        <div class="Widget Clock">
          <span id="Clock-1"></span>
          <!-- BeatTime — universal @beat clock (beattime.live) -->
          <a href="https://beattime.live" data-beattime data-format="centi" data-theme="auto"
             style="font:inherit;text-decoration:none">@---</a>
          <script src="https://beattime.live/embed.js" async></script>
        </div>
      </div>
    </div>
  </body>
</html>
