<html>
  <head>
    <title id="title"></title>
  </head>
  <body>
    <div id="marked">
    </div>
    <script type="module"> 
      import { marked } from "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js";
      const response = await fetch('content.md');
      if (!response.ok) throw new Error('Could not load markdown file');
    
      const markdownText = await response.text();
      document.getElementById('marked').innerHTML = marked.parse(markdownText);

    </script>
    <div id="cusdis_thread"
      data-host="https://cusdis.com"
      data-app-id="0012af3f-d009-421e-bd7f-1b50a9500c55"
      data-page-id="{{ PAGE_ID }}"
      data-page-url="{{ PAGE_URL }}"
      data-page-title="{{ PAGE_TITLE }}"
    ></div>
    <script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
    
    <script>
      // 1. Select the container element
      const container = document.querySelectorAll('div p');
      
      // 2. Define the target text and your replacement image HTML
      const targetText = "$$kona1$$";
      const imageHtml = '<img src="" alt="Star Image" width="20" height="20" />';
      
      // 3. Create a global Regular Expression to find all occurrences
      const regex = new RegExp(targetText, "g");
      
      // 4. Replace the text inside the HTML and update the container
      container.innerHTML = container.innerHTML.replace(regex, imageHtml);
    </script>
  </body>
</html>
