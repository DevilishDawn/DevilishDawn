<!DOCTYPE html>
<html>
  <head>
    <meta property="og:title" content="Dawn's Awesome Beta Profile!!">
    <meta property="og:url" content="https://devilishdawn.github.io/DevilishDawn/beta/">
    <link rel="stylesheet" href="https://cdn.cursors-4u.net/cursors/animated/konata-izumi-dancing-68cd9a9b-32.css">
    <link rel="stylesheet" href="https://unpkg.com/xp.css">
    <title>Beta Bio</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #5A7EDC;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }

      .window {
        position: absolute;
        display: flex;
        flex-direction: column;
        min-width: 400px;
      }

      #blog-window {
        top: 40px;
        left: 40px;
      }

      #media-window {
        top: 120px;
        left: 480px;
      }

      .window-body {
        margin: 4px;
        display: flex;
        flex-direction: column;
      }

      iframe {
        width: 100%;
        height: 450px;
        border: none;
        background: #ffffff;
      }

      #media-body {
        width: auto;
        height: 450px;
        border: none;
        background: #ffffff;
      } 

      #desktop-icons {
          display: inline-grid;
          grid-auto-flow: column;
          grid-template-rows: repeat(auto-fill, 75px); 
          grid-template-columns: repeat(auto-fill, 75px);
          gap: 43px;
          z-index: 1;
      }
    </style>
  </head>
  <body>
    <div class="main" style="">
      <div class="widget" id="desktop-icons">
        <img src="https://cdn2.steamgriddb.com/icon/af1870edf5b2de354c2b90d442a299d3.ico" width="48px" height="48px">
      </div>
      <div class="window" id="blog-window">
        <div class="title-bar">
          <div class="title-bar-text" style="display: flex; gap: 4px; align-items: center;">
            <img src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/ec0429cf-1471-466c-b958-f3b1faa7896b/d5zjlvr-f5694e01-ce96-424d-9616-333d177a9cca.png?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi9lYzA0MjljZi0xNDcxLTQ2NmMtYjk1OC1mM2IxZmFhNzg5NmIvZDV6amx2ci1mNTY5NGUwMS1jZTk2LTQyNGQtOTYxNi0zMzNkMTc3YTljY2EucG5nIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.UgULkVcIucyEQqvfXiDlvpICPBbn7a9JBnWPg3oiEMI" width="16px" height="16px">
            <span>Dawn's Blog!</span>
          </div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body" id="blog-body">
          <iframe src="blog.html"></iframe>
        </div>
      </div>

      <div class="window" id="media-window">
        <div class="title-bar">
          <div class="title-bar-text" style="display: flex; gap: 4px; align-items: center;">
            <!-- <img src="" width="16px" height="16px"> -->
            <span>Dawn's Winamp!</span>
          </div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body" id="media-body">
          <iframe src="media.html"></iframe>
        </div>
      </div>

    </div>

    <script type="module">
      import { Draggable } from 'https://cdn.jsdelivr.net/npm/@neodrag/vanilla@latest/+esm';

      document.querySelectorAll(".window").forEach((win) => {
        new Draggable(win, { handle: ".title-bar" });
        
        win.addEventListener('mousedown', () => {
          document.querySelectorAll(".window").forEach(w => w.style.zIndex = "1");
          win.style.zIndex = "10";
        });
      });
    </script>
  </body>
</html>
