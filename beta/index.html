<!DOCTYPE html>
<html>
  <head>
    <meta property="og:title" content="Dawn's Awesome Beta Profile!!">
    <meta property="og:url" content="https://devilishdawn.github.io/DevilishDawn/beta/">
    <!-- Main XP.css Framework Stylesheet -->
    <link rel="stylesheet" href="https://cdn.cursors-4u.net/cursors/animated/konata-izumi-dancing-68cd9a9b-32.css">
    <link rel="stylesheet" href="https://unpkg.com/xp.css">
    <title>Beta Bio</title>
    <style>
      /* Desktop environment setup */
      body {
        margin: 0;
        padding: 0;
        background-color: #5A7EDC; /* Classic Windows XP Desktop Blue */
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }

      /* Base layout for absolute window cards */
      .window {
        position: absolute;
        display: flex;
        flex-direction: column;
        min-width: 400px; /* Prevents title bars and windows from collapsing */
      }

      /* Separate initial coordinate positioning */
      #blog-window {
        top: 40px;
        left: 40px;
      }

      #media-window {
        top: 120px;
        left: 480px;
      }

      /* Clean visual layout inside the frame body */
      .window-body {
        margin: 4px;
        display: flex;
        flex-direction: column;
      }

      iframe {
        width: 100%;
        height: 450px;
        border: none;
        background: #ffffff;
      }

      #desktop-icons {
          display: inline-grid;
          grid-auto-flow: column; /* XP lines up icons vertically first */
          grid-template-rows: repeat(auto-fill, 75px); 
          grid-template-columns: repeat(auto-fill, 75px);
          gap: 43px; /* The exact Windows XP icon spacing */
      }
    </style>
  </head>
  <body>
    <div class="main" style="">
      <div class="widget" id="desktop-icons">
        
      </div>
      <!-- Blog Window Container -->
      <div class="window" id="blog-window">
        <div class="title-bar">
          <div class="title-bar-text" style="display: flex; gap: 4px; align-items: center;">
            <!-- <img src="" width="16px" height="16px"> -->
            <span>Dawn's Blog!</span>
          </div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body">
          <iframe src="blog.html"></iframe>
        </div>
      </div>

      <!-- Winamp Media Window Container -->
      <div class="window" id="media-window">
        <div class="title-bar">
          <div class="title-bar-text" style="display: flex; gap: 4px; align-items: center;">
            <!-- <img src="" width="16px" height="16px"> -->
            <span>Dawn's Winamp!</span>
          </div>
          <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
          </div>
        </div>
        <div class="window-body">
          <iframe src="media.html"></iframe>
        </div>
      </div>

    </div>

    <!-- Multi-window drag script setup -->
    <script type="module">
      import { Draggable } from 'https://cdn.jsdelivr.net/npm/@neodrag/vanilla@latest/+esm';

      // Bind dragging modules cleanly across selector classes
      document.querySelectorAll(".window").forEach((win) => {
        new Draggable(win, { handle: ".title-bar" });
        
        // Z-Index focus toggle trigger
        win.addEventListener('mousedown', () => {
          document.querySelectorAll(".window").forEach(w => w.style.zIndex = "1");
          win.style.zIndex = "10";
        });
      });
    </script>
  </body>
</html>
