<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio Player with Upload</title>
</head>
<body>
    <h1>Upload and Play Audio</h1>

    <!-- File input for the user to select an audio file -->
    <input type="file" id="audio-upload" accept="audio/*" title="Upload Audio File">

    <!-- The audio player element, controls are added by default -->
    <audio id="audio-player" controls>
        Your browser does not support the audio element.
    </audio>

    <!-- Link to the JavaScript file -->
    <script src="audio-player.js"></script>
</body>
</html>
