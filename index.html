<html>
  <head>
    <title>Dawns Bio</title>
    <link rel="stylesheet" href="https://unpkg.com/7.css">
  </head>
  <body style="background-image: url('https://c4.wallpaperflare.com/wallpaper/162/306/559/microsoft-windows-mountain-operating-systems-windows-vista-wallpaper-preview.jpg'); background-size: 100% 100%; background-repeat: no-repeat;">
    <script src="https://unpkg.com/@neodrag/vanilla@latest/dist/umd/index.js"></script>
    <div id="main">
      <div class="background">
        <div id="window" class="window glass active" style="max-width: 100%; --w7-w-bg: #805ba5; opacity: 0.7;">
          <div class="title-bar">
            <div class="title-bar-text">A glass violet window frame</div>
            <div class="title-bar-controls">
              <button aria-label="Minimize"></button>
              <button aria-label="Close"></button>
            </div>
          </div>
          <div class="window-body has-space" style="opacity: 1;">
            <p>And even the glass window frame as well.</p>
          </div>
        </div>
      </div>
    </div>
    <script>
      var dragInstance = new NeoDrag.Draggable(document.getElementById('window'), {
        handle: '.title-bar' 
      });
    </script>
  </body>
</html>
